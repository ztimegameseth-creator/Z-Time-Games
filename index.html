<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Z-Time Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a24;
            --accent-blue: #00d2ff;
            --accent-gold: #ffcc00;
            --accent-red: #ff3344;
            --text-main: #ffffff;
            --text-muted: #8a99ad;
            --nav-bg: #121821;
        }

        /* Splash Screen Style */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .loader { width: 40px; height: 40px; border: 4px solid var(--accent-blue); border-top: 4px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-top: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Main Styles */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; overflow-x: hidden; }

        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: linear-gradient(to bottom, #121722, var(--bg-color)); position: sticky; top: 0; z-index: 100; }
        .brand-logo { font-size: 22px; font-weight: 700; letter-spacing: 1px; background: linear-gradient(45deg, var(--accent-blue), var(--accent-red)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .balance-badge { background: rgba(0, 210, 255, 0.1); border: 1px solid rgba(0, 210, 255, 0.3); padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: 600; color: var(--accent-blue); }
        .view-content { display: none; padding: 20px; animation: fadeIn 0.2s ease-in-out; }
        .view-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .section-title { font-size: 18px; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
        .game-item-card { background-color: var(--card-bg); border-radius: 14px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05); position: relative; cursor: pointer; transition: transform 0.2s; }
        .game-item-card:active { transform: scale(0.96); }
        .game-image-holder { height: 110px; background: linear-gradient(135deg, #1e2640, #111520); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; color: #fff; }
        .game-image-holder i { font-size: 36px; margin-bottom: 5px; }
        .hot-badge { position: absolute; top: 8px; right: 8px; background-color: var(--accent-red); color: white; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        .game-info-box { padding: 10px; background: #171e2b; text-align: center; }
        .game-info-box h4 { font-size: 13px; font-weight: 600; color: var(--text-main); }
        .game-info-box p { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
        .z-card { background-color: var(--card-bg); border-radius: 14px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .coin-box { text-align: center; margin: 15px 0; }
        .coin { width: 80px; height: 80px; background: linear-gradient(135deg, #ffe066, #f5b041); border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #333; font-weight: bold; border: 4px solid #fff; box-shadow: 0 0 15px rgba(255, 204, 0, 0.3); }
        input[type="number"] { width: 100%; padding: 12px; background: #0b0e14; border: 1px solid #2d3748; color: #fff; border-radius: 8px; text-align: center; margin-bottom: 15px; font-size: 16px; outline: none; }
        .btn-group { display: flex; gap: 10px; }
        .z-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; }
        .btn-primary { background: linear-gradient(135deg, var(--accent-blue), #0088cc); color: #fff; }
        .btn-secondary { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid rgba(255, 255, 255, 0.05); }
        .btn-back { background: transparent; color: var(--accent-blue); font-size: 13px; margin-bottom: 15px; width: auto; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
        .card-label { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .card-value { font-size: 26px; font-weight: 700; margin-bottom: 15px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 15px; text-align: center; }
        .stat-num { font-size: 16px; font-weight: 600; }
        .stat-lbl { font-size: 10px; color: var(--text-muted); }
        .detail-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 14px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background-color: var(--nav-bg); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.05); z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 11px; cursor: pointer; gap: 4px; flex: 1; height: 100%; justify-content: center; }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: var(--accent-blue); }
    </style>
</head>
<body>

    <div id="splash-screen">
        <h1 class="brand-logo" style="font-size: 40px;">Z-TIME</h1>
        <div class="loader"></div>
    </div>

    <div class="app-header">
        <div class="brand-logo">Z-TIME</div>
        <div class="balance-badge"><i class="fa-solid fa-wallet"></i> <span class="user-balance-txt">0.00</span> ETB</div>
    </div>

    <div id="view-games" class="view-content active">
        <div id="games-menu-section">
            <h3 class="section-title">🎮 Top Games</h3>
            <div class="games-grid">
                <div class="game-item-card" onclick="openGame('coinflip')">
                    <div class="game-image-holder" style="background: linear-gradient(135deg, #b27a00, #4c3600);"><span class="hot-badge">Hot</span><i class="fa-solid fa-circle-dollar-to-slot" style="color: #ffcc00;"></i></div>
                    <div class="game-info-box"><h4>Coin Flip</h4><p>ሰው ወይስ አንበሳ</p></div>
                </div>
                <div class="game-item-card" onclick="openGame('plinko')">
                    <div class="game-image-holder" style="background: linear-gradient(135deg, #0f4c81, #051c33);"><i class="fa-solid fa-pyramid" style="color: #00d2ff;"></i></div>
                    <div class="game-info-box"><h4>Plinko</h4><p>ኳስ ጣል ያድርጉ</p></div>
                </div>
            </div>
        </div>

        <div id="game-arena-section" style="display: none;">
            <div class="btn-back" onclick="backToMenu()"><i class="fa-solid fa-arrow-left"></i> ወደ ማውጫ ተመለስ</div>
            <div id="coin-game-box" class="z-card">
                <h3 style="text-align:center; margin-bottom:15px;" id="playing-game-title">Coin Flip</h3>
                <div class="coin-box">
                    <div id="main-coin" class="coin">?</div>
                    <input type="number" id="bet-amount" placeholder="የውርርድ መጠን (ETB)">
                    <div class="btn-group">
                        <button class="z-btn btn-primary" onclick="playCoin('ሰው')">ሰው</button>
                        <button class="z-btn btn-secondary" onclick="playCoin('አንበሳ')">አንበሳ</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="view-wallet" class="view-content">
        <h2 style="margin-bottom: 15px;">Wallet</h2>
        <div class="z-card">
            <p class="card-label">Main Balance</p>
            <div class="card-value">ETB <span class="user-balance-txt">0.00</span></div>
        </div>
    </div>

    <div id="view-profile" class="view-content">
        <h2 style="margin-bottom: 15px;">Profile</h2>
        <div class="z-card"><h3 id="profile-name">Loading...</h3></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchView('view-games', this)"><i class="fa-solid fa-gamepad"></i>Games</div>
        <div class="nav-item" onclick="switchView('view-wallet', this)"><i class="fa-solid fa-wallet"></i>Wallet</div>
        <div class="nav-item" onclick="switchView('view-profile', this)"><i class="fa-solid fa-user"></i>Profile</div>
    </div>

    <script>
        const S_URL = "https://wjmlmtebrzeikhqevryr.supabase.co";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqbG1sdGVicnplaWtocWV2cnlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NjQzMTksImV4cCI6MjA5NjQ0MDMxOX0.5iX64N67C5rhBcsBWCty6koLDNN_7XW2Nfo7jSbOu3U";
        
        // Splash Screen Logic
        window.onload = () => {
            initApp();
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('splash-screen').style.display = 'none', 500);
            }, 2000);
        };

        async function initApp() {
            try { _supabase = window.supabase.createClient(S_URL, S_KEY); } catch(e) {}
            const tg = window.Telegram.WebApp;
            tg.expand();
            // Data loading logic...
            currentUser = { first_name: "Player", balance: 100.00 }; 
            renderUI();
        }

        function renderUI() {
            document.querySelectorAll('.user-balance-txt').forEach(el => el.innerText = parseFloat(currentUser.balance).toFixed(2));
            document.getElementById('profile-name').innerText = currentUser.first_name;
        }

        function switchView(viewId, el) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            el.classList.add('active');
            backToMenu();
        }

        function openGame(gameType) {
            document.getElementById('games-menu-section').style.display = 'none';
            document.getElementById('game-arena-section').style.display = 'block';
        }

        function backToMenu() {
            document.getElementById('game-arena-section').style.display = 'none';
            document.getElementById('games-menu-section').style.display = 'block';
        }
    </script>
</body>
</html>
