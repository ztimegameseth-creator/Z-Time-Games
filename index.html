<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Z-Time Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a24;
            --accent-blue: #00d2ff;
            --accent-red: #ff3344;
            --text-main: #ffffff;
            --text-muted: #8a99ad;
            --nav-bg: #121821;
        }

        /* 1. Splash Screen ዲዛይን */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .splash-logo {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(45deg, var(--accent-blue), var(--accent-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .loader {
            width: 35px;
            height: 35px;
            border: 3px solid rgba(0, 210, 255, 0.1);
            border-top: 3px solid var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-top: 25px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 2. ዋናው ገጽ ዲዛይን */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; overflow-x: hidden; }

        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: linear-gradient(to bottom, #121722, var(--bg-color)); position: sticky; top: 0; z-index: 100; }
        .brand-logo { font-size: 22px; font-weight: 700; letter-spacing: 1px; background: linear-gradient(45deg, var(--accent-blue), var(--accent-red)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .balance-badge { background: rgba(0, 210, 255, 0.1); border: 1px solid rgba(0, 210, 255, 0.3); padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: 600; color: var(--accent-blue); }
        
        .view-content { display: none; padding: 20px; }
        .view-content.active { display: block; }
        
        .section-title { font-size: 18px; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
        
        .game-item-card { background-color: var(--card-bg); border-radius: 14px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05); position: relative; cursor: pointer; transition: transform 0.2s; }
        .game-item-card:active { transform: scale(0.96); }
        .game-image-holder { height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .game-image-holder i { font-size: 36px; margin-bottom: 5px; }
        .hot-badge { position: absolute; top: 8px; right: 8px; background-color: var(--accent-red); color: white; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        .game-info-box { padding: 10px; background: #171e2b; text-align: center; }
        .game-info-box h4 { font-size: 13px; font-weight: 600; }
        .game-info-box p { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
        
        .z-card { background-color: var(--card-bg); border-radius: 14px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .card-label { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .card-value { font-size: 26px; font-weight: 700; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background-color: var(--nav-bg); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.05); z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 11px; cursor: pointer; gap: 4px; flex: 1; height: 100%; justify-content: center; }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: var(--accent-blue); }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-logo">Z-TIME</div>
        <div class="loader"></div>
    </div>

    <div class="app-header">
        <div class="brand-logo">Z-TIME</div>
        <div class="balance-badge"><i class="fa-solid fa-wallet"></i> <span>100.00</span> ETB</div>
    </div>

    <div id="view-games" class="view-content active">
        <h3 class="section-title">🎮 Top Games</h3>
        <div class="games-grid">
            <div class="game-item-card" onclick="alert('Coin Flip ለመጫወት በቅርቡ ይለቀቃል!')">
                <div class="game-image-holder" style="background: linear-gradient(135deg, #b27a00, #4c3600);"><span class="hot-badge">Hot</span><i class="fa-solid fa-circle-dollar-to-slot" style="color: #ffcc00;"></i></div>
                <div class="game-info-box"><h4>Coin Flip</h4><p>ሰው ወይስ አንበሳ</p></div>
            </div>
            <div class="game-item-card" onclick="alert('Plinko ለመጫወት በቅርቡ ይለቀቃል!')">
                <div class="game-image-holder" style="background: linear-gradient(135deg, #0f4c81, #051c33);"><i class="fa-solid fa-pyramid" style="color: #00d2ff;"></i></div>
                <div class="game-info-box"><h4>Plinko</h4><p>ኳስ ጣል ያድርጉ</p></div>
            </div>
        </div>
    </div>

    <div id="view-wallet" class="view-content">
        <h2 style="margin-bottom: 15px;">Wallet</h2>
        <div class="z-card">
            <p class="card-label">Main Balance</p>
            <div class="card-value">ETB 100.00</div>
        </div>
    </div>

    <div id="view-profile" class="view-content">
        <h2 style="margin-bottom: 15px;">Profile</h2>
        <div class="z-card">
            <h3>Player</h3>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchView('view-games', this)"><i class="fa-solid fa-gamepad"></i>Games</div>
        <div class="nav-item" onclick="switchView('view-wallet', this)"><i class="fa-solid fa-wallet"></i>Wallet</div>
        <div class="nav-item" onclick="switchView('view-profile', this)"><i class="fa-solid fa-user"></i>Profile</div>
    </div>

    <script>
        // Splash Screen ማጥፊያ ሎጂክ (ከ2 ሰከንድ በኋላ ይጠፋል)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.style.visibility = 'hidden';
                    splash.style.display = 'none';
                }, 500);
            }, 2000);
        });

        // ገጾችን መቀያየሪያ ሎጂክ
        function switchView(viewId, el) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            el.classList.add('active');
        }
    </script>
</body>
</html>
